<svg class="tzr tzr-asr" viewBox="0 0 340 140" role="img" aria-label="A personalisation list entry for the contact Zheng Zihao switches on and off. When it is on the speech recogniser transcribes the name correctly; when it is off the last three characters change to homophones that are not a name." xmlns="http://www.w3.org/2000/svg">
