  <rect class="tzr-boxoff" x="34" y="28" width="13" height="13" rx="3" />
  <g class="tzr-on">
    <rect class="tzr-boxon" x="34" y="28" width="13" height="13" rx="3" />
    <path class="tzr-tick" d="M37.3,34.6 L40.1,37.4 L44.2,31.8" />
