    <rect x="24" y="72" width="37" height="34" rx="6" />
    <rect x="66.5" y="72" width="37" height="34" rx="6" />
    <rect x="109" y="72" width="37" height="34" rx="6" />
    <rect x="151.5" y="72" width="37" height="34" rx="6" />
  </g>
  <text class="tzr-cjk" x="42.5" y="96">&#25171;</text>
  <text class="tzr-cjk" x="85" y="96">&#30005;</text>
  <text class="tzr-cjk" x="127.5" y="96">&#35805;</text>
  <text class="tzr-cjk" x="170" y="96">&#32473;</text>

  <g class="tzr-on">
    <rect class="tzr-cell-good" x="194" y="72" width="37" height="34" rx="6" />
    <rect class="tzr-cell-good" x="236.5" y="72" width="37" height="34" rx="6" />
    <rect class="tzr-cell-good" x="279" y="72" width="37" height="34" rx="6" />
    <text class="tzr-cjk tzr-good" x="212.5" y="96">&#37073;</text>
