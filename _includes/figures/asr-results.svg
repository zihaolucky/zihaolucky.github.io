<svg class="dgm" viewBox="0 0 1000 496" role="img" aria-labelledby="asrResT asrResD" xmlns="http://www.w3.org/2000/svg">
  <title id="asrResT">Production results across three generations of the Tmall Genie speech stack</title>
  <desc id="asrResD">Negative user feedback fell from 22.38 percent with traditional ASR to 15.90 percent with an end-to-end model without context, and to 15.01 percent with the context-aware architecture &#8212; a 32.9 percent reduction against the traditional baseline. Multi-turn turns that failed to complete fell from 21.72 percent to 14.50 percent to 12.98 percent, meaning completion rose from 78.28 to 87.02 percent. In a head-to-head evaluation against Google CLAS, character error rate was 20.00 versus 20.90 on IoT device names, 21.38 versus 21.88 on contact names, and 16.54 versus 16.85 on a combined general and contact set.</desc>

  <text class="t-title" x="24" y="28">Production impact across three generations of the speech stack</text>
  <text class="t-sub" x="24" y="50">Measured on live Tmall Genie traffic &#8212; the 53.8% of sessions that involve multi-turn dialogue. Lower is better in both charts.</text>

  <!-- ============ LEFT CHART: negative feedback ============ -->
  <text class="t-box" x="80" y="84">Negative user feedback rate</text>

  <line class="rule" x1="80" y1="110" x2="480" y2="110" />
  <line class="rule" x1="80" y1="152" x2="480" y2="152" />
  <line class="rule" x1="80" y1="194" x2="480" y2="194" />
  <line class="rule" x1="80" y1="236" x2="480" y2="236" />
  <line class="rule" x1="80" y1="278" x2="480" y2="278" />
  <line class="rule" x1="80" y1="320" x2="480" y2="320" stroke="#87867f" />
  <text class="t-tiny t-end" x="72" y="114">25%</text>
  <text class="t-tiny t-end" x="72" y="198">15%</text>
  <text class="t-tiny t-end" x="72" y="282">5%</text>
  <text class="t-tiny t-end" x="72" y="324">0</text>

  <rect class="bar-old" x="110" y="132" width="80" height="188" rx="4" />
  <text class="t-lead t-mid" x="150" y="124">22.38%</text>
  <rect class="bar-mid" x="245" y="186" width="80" height="134" rx="4" />
  <text class="t-lead t-mid" x="285" y="178">15.90%</text>
  <rect class="bar-new" x="380" y="194" width="80" height="126" rx="4" />
  <text class="t-lead t-mid" x="420" y="186">15.01%</text>

  <text class="t-tiny t-mid" x="150" y="340">Traditional ASR</text>
  <text class="t-tiny t-mid" x="150" y="354">v1.0</text>
  <text class="t-tiny t-mid" x="285" y="340">End-to-end,</text>
  <text class="t-tiny t-mid" x="285" y="354">no context (v2.0)</text>
  <text class="t-tiny t-mid t-accent t-bold" x="420" y="340">Context-aware</text>
  <text class="t-tiny t-mid t-accent t-bold" x="420" y="354">this work</text>

  <text class="t-small t-accent t-bold" x="80" y="378">&#8722;32.9% against the traditional baseline</text>

  <!-- ============ RIGHT CHART: incomplete multi-turn ============ -->
  <text class="t-box" x="600" y="84">Multi-turn requests that failed to complete</text>

  <line class="rule" x1="600" y1="110" x2="980" y2="110" />
  <line class="rule" x1="600" y1="152" x2="980" y2="152" />
  <line class="rule" x1="600" y1="194" x2="980" y2="194" />
  <line class="rule" x1="600" y1="236" x2="980" y2="236" />
  <line class="rule" x1="600" y1="278" x2="980" y2="278" />
  <line class="rule" x1="600" y1="320" x2="980" y2="320" stroke="#87867f" />
  <text class="t-tiny t-end" x="592" y="114">25%</text>
  <text class="t-tiny t-end" x="592" y="198">15%</text>
  <text class="t-tiny t-end" x="592" y="282">5%</text>
  <text class="t-tiny t-end" x="592" y="324">0</text>

  <rect class="bar-old" x="630" y="138" width="80" height="182" rx="4" />
  <text class="t-lead t-mid" x="670" y="130">21.72%</text>
  <rect class="bar-mid" x="755" y="198" width="80" height="122" rx="4" />
  <text class="t-lead t-mid" x="795" y="190">14.50%</text>
  <rect class="bar-new" x="880" y="211" width="80" height="109" rx="4" />
  <text class="t-lead t-mid" x="920" y="203">12.98%</text>

  <text class="t-tiny t-mid" x="670" y="340">Traditional ASR</text>
  <text class="t-tiny t-mid" x="670" y="354">v1.0</text>
  <text class="t-tiny t-mid" x="795" y="340">End-to-end,</text>
  <text class="t-tiny t-mid" x="795" y="354">no context (v2.0)</text>
  <text class="t-tiny t-mid t-accent t-bold" x="920" y="340">Context-aware</text>
  <text class="t-tiny t-mid t-accent t-bold" x="920" y="354">this work</text>

  <text class="t-small t-accent t-bold" x="600" y="378">Task completion 78.28% &#8594; 87.02%</text>

  <!-- ============ CER head-to-head ============ -->
  <rect class="box" x="24" y="398" width="952" height="86" rx="10" />
  <text class="t-tiny t-bold" x="48" y="422">HEAD-TO-HEAD AGAINST GOOGLE CLAS &#8212; CHARACTER ERROR RATE, LOWER IS BETTER</text>

  <text class="t-tiny t-bold t-accent" x="48" y="446">IOT DEVICE NAMES</text>
  <text class="t-small" x="48" y="466">Indicator Loss</text>
  <text class="t-num" x="240" y="466">20.00</text>
  <text class="t-small" x="48" y="480" fill="#87867f">Google CLAS</text>
  <text class="t-num" x="240" y="480" fill="#87867f">20.90</text>

  <text class="t-tiny t-bold t-accent" x="368" y="446">CONTACT NAMES</text>
  <text class="t-small" x="368" y="466">Indicator Loss</text>
  <text class="t-num" x="560" y="466">21.38</text>
  <text class="t-small" x="368" y="480" fill="#87867f">Google CLAS</text>
  <text class="t-num" x="560" y="480" fill="#87867f">21.88</text>

  <text class="t-tiny t-bold t-accent" x="688" y="446">GENERAL + CONTACT</text>
  <text class="t-small" x="688" y="466">Indicator Loss</text>
  <text class="t-num" x="880" y="466">16.54</text>
  <text class="t-small" x="688" y="480" fill="#87867f">Google CLAS</text>
  <text class="t-num" x="880" y="480" fill="#87867f">16.85</text>
</svg>
