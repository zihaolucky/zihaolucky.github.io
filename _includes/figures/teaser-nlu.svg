<svg class="tzr tzr-nlu" viewBox="0 0 340 140" role="img" aria-label="Seven voice requests scored against the two possible cascade wirings. Rules first routes five of seven correctly. Model first also routes five of seven, but fails on a different pair of requests. Neither wiring reaches all seven." xmlns="http://www.w3.org/2000/svg">
  <text class="tzr-cap" x="8" y="24">7 requests &#183; one cascade, two ways to wire it</text>

  <g class="tzr-alt-a">
