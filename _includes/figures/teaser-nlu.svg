    <rect class="tzr-pip-ok" x="196" y="54" width="24" height="20" rx="3" />
    <rect class="tzr-pip-ok" x="224" y="54" width="24" height="20" rx="3" />
    <rect class="tzr-pip-bad" x="252" y="54" width="24" height="20" rx="3" />
    <text class="tzr-score" x="332" y="69" text-anchor="end">5/7</text>
  </g>

  <text class="tzr-lbl" x="8" y="116">the failures move &#8212; the total never does</text>
